# DOSBox-X settings for Rocks'n'Diamonds. From the RND folder:
#     dosbox-x -conf dosbox-x.conf
# Plain DOSBox can't run the game: it has no long file names, and at most
# 63 MB of memory (the game needs 128 MB).

[sdl]
output=surface

[dosbox]
memsize=128
machine=svga_s3

[cpu]
core=dynamic
cycles=max

[dos]
lfn=true

[sblaster]
sbtype=sb16

[autoexec]
mount c .
c:
RND
exit
